services:
  ai-window-manager:
    build:
      context: .
    image: ai-window-manager:dev
    restart: unless-stopped
    environment:
      AWM_BIND: 0.0.0.0
      AWM_PORT: 8787
      AWM_DB_PATH: /data/window-manager.db
      AWM_LOG_LEVEL: ${AWM_LOG_LEVEL:-info}
      AWM_TIMEZONE: ${AWM_TIMEZONE:-America/Sao_Paulo}
      AWM_FAKE_PROVIDER_ENABLED: ${AWM_FAKE_PROVIDER_ENABLED:-true}
      AWM_CODEX_ENABLED: ${AWM_CODEX_ENABLED:-false}
      AWM_CODEX_TRIGGER_ENABLED: ${AWM_CODEX_TRIGGER_ENABLED:-false}
      AWM_CODEX_HOME: ${AWM_CODEX_HOME:-/codex-state}
      AWM_CODEX_EXECUTABLE: ${AWM_CODEX_EXECUTABLE:-/opt/codex/bin/codex}
      AWM_RECONCILE_INTERVAL_SECONDS: ${AWM_RECONCILE_INTERVAL_SECONDS:-30}
      AWM_EXECUTOR_INTERVAL_SECONDS: ${AWM_EXECUTOR_INTERVAL_SECONDS:-5}
      AWM_RETENTION_INTERVAL_SECONDS: ${AWM_RETENTION_INTERVAL_SECONDS:-86400}
    ports:
      - '${AWM_HOST_BIND:-127.0.0.1}:${AWM_HOST_PORT:-8787}:8787'
    volumes:
      - awm-data:/data
      - awm-codex-state:/codex-state
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  awm-data:
  awm-codex-state:
