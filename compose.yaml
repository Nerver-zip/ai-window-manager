services:
  ai-window-manager:
    build:
      context: .
    image: ${AWM_IMAGE:-ai-window-manager:dev}
    restart: unless-stopped
    environment:
      AWM_BIND: 0.0.0.0
      AWM_PORT: 8787
      AWM_DB_PATH: /data/window-manager.db
      AWM_PROVIDER_CLIENT_RUNTIME_ROOT: /provider-clients
      AWM_LOG_LEVEL: ${AWM_LOG_LEVEL:-info}
      AWM_TIMEZONE: ${AWM_TIMEZONE:-America/Sao_Paulo}
      AWM_FAKE_PROVIDER_ENABLED: ${AWM_FAKE_PROVIDER_ENABLED:-false}
      AWM_CODEX_ENABLED: ${AWM_CODEX_ENABLED:-false}
      AWM_CODEX_TRIGGER_ENABLED: ${AWM_CODEX_TRIGGER_ENABLED:-true}
      AWM_CODEX_HOME: ${AWM_CODEX_HOME:-/codex-state}
      AWM_CODEX_EXECUTABLE: ${AWM_CODEX_EXECUTABLE:-/provider-clients/codex/current}
      AWM_CODEX_ACTION_TIMEOUT_SECONDS: ${AWM_CODEX_ACTION_TIMEOUT_SECONDS:-30}
      AWM_AUTH_SESSION_TIMEOUT_SECONDS: ${AWM_AUTH_SESSION_TIMEOUT_SECONDS:-900}
      AWM_AUTH_USERNAME: ${AWM_AUTH_USERNAME:?Set AWM_AUTH_USERNAME in .env}
      AWM_AUTH_PASSWORD_HASH: ${AWM_AUTH_PASSWORD_HASH:?Set AWM_AUTH_PASSWORD_HASH in .env}
      AWM_AUTH_SESSION_TTL_SECONDS: ${AWM_AUTH_SESSION_TTL_SECONDS:-43200}
      AWM_TRUST_PROXY: ${AWM_TRUST_PROXY:-}
      AWM_METRICS_TOKEN_SHA256: ${AWM_METRICS_TOKEN_SHA256:-}
      AWM_ANTIGRAVITY_ENABLED: ${AWM_ANTIGRAVITY_ENABLED:-false}
      AWM_ANTIGRAVITY_TRIGGER_ENABLED: ${AWM_ANTIGRAVITY_TRIGGER_ENABLED:-true}
      AWM_ANTIGRAVITY_ACTION_TIMEOUT_SECONDS: ${AWM_ANTIGRAVITY_ACTION_TIMEOUT_SECONDS:-30}
      AWM_ANTIGRAVITY_GEMINI_TRIGGER_MODEL: ${AWM_ANTIGRAVITY_GEMINI_TRIGGER_MODEL:-gemini-3.8-flash-low}
      AWM_ANTIGRAVITY_CLAUDE_GPT_TRIGGER_MODEL: ${AWM_ANTIGRAVITY_CLAUDE_GPT_TRIGGER_MODEL:-claude-sonnet-4-6}
      AWM_ANTIGRAVITY_HOME: ${AWM_ANTIGRAVITY_HOME:-/antigravity-state}
      AWM_ANTIGRAVITY_EXECUTABLE: ${AWM_ANTIGRAVITY_EXECUTABLE:-/provider-clients/antigravity/current}
      # Path only; the secret contents must be supplied through a separate mounted
      # file under /run/secrets when keyring unlock is explicitly required.
      AWM_ANTIGRAVITY_KEYRING_SECRET_FILE: ${AWM_ANTIGRAVITY_KEYRING_SECRET_FILE:-}
      AWM_RECONCILE_INTERVAL_SECONDS: ${AWM_RECONCILE_INTERVAL_SECONDS:-30}
      AWM_EXECUTOR_INTERVAL_SECONDS: ${AWM_EXECUTOR_INTERVAL_SECONDS:-5}
      AWM_RETENTION_INTERVAL_SECONDS: ${AWM_RETENTION_INTERVAL_SECONDS:-86400}
    ports:
      - '${AWM_HOST_BIND:-0.0.0.0}:${AWM_HOST_PORT:-8787}:8787'
    volumes:
      - awm-data:/data
      - awm-codex-state:/codex-state
      - awm-antigravity-state:/antigravity-state
      - awm-antigravity-keyring:/antigravity-keyring
      - awm-provider-clients:/provider-clients
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=16m,mode=755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: '10001:10001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  awm-data:
  awm-codex-state:
  awm-antigravity-state:
  awm-antigravity-keyring:
  awm-provider-clients:
