# Copy this file to the ignored compose.antigravity-secret.yaml only when an
# operator-managed keyring unlock file is required. Set
# AWM_ANTIGRAVITY_KEYRING_SECRET_SOURCE to its host path in the local .env.
services:
  ai-window-manager:
    environment:
      AWM_ANTIGRAVITY_KEYRING_SECRET_FILE: /run/secrets/antigravity-keyring
    secrets:
      - source: antigravity_keyring
        target: antigravity-keyring

secrets:
  antigravity_keyring:
    file: ${AWM_ANTIGRAVITY_KEYRING_SECRET_SOURCE:?Set the host path to the protected keyring unlock file}
