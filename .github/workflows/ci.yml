name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit all locked dependencies
        run: pnpm audit --audit-level moderate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Test release-note generation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.15.0
          run_install: false
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location \
            "${base_url}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          curl --fail --silent --show-error --location \
            "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            --output "${RUNNER_TEMP}/gitleaks_checksums.txt"
          grep -F "  ${archive}" "${RUNNER_TEMP}/gitleaks_checksums.txt" \
            > "${RUNNER_TEMP}/gitleaks_checksum.txt"
          (cd "${RUNNER_TEMP}" && sha256sum --check gitleaks_checksum.txt)
          mkdir --parents "${RUNNER_TEMP}/gitleaks-bin"
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}/gitleaks-bin"
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" version
      - name: Run the local secret scan
        run: pnpm secret:scan

  workflow-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.1'
          cache: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint GitHub Actions workflows
        run: '"$(go env GOPATH)/bin/actionlint"'

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  docker:
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Authenticated Compose persistence smoke test
        run: ./scripts/docker_auth_smoke.sh
      - name: Set up QEMU for arm64 validation
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build both supported Linux architectures without publishing
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --tag ai-window-manager:ci-multiarch
          --output "type=oci,dest=${RUNNER_TEMP}/ai-window-manager-multiarch.oci"
          .
