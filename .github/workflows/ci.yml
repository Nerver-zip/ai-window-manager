name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.15.0
          run_install: false
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location \
            "${base_url}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          curl --fail --silent --show-error --location \
            "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            --output "${RUNNER_TEMP}/gitleaks_checksums.txt"
          grep -F "  ${archive}" "${RUNNER_TEMP}/gitleaks_checksums.txt" \
            > "${RUNNER_TEMP}/gitleaks_checksum.txt"
          (cd "${RUNNER_TEMP}" && sha256sum --check gitleaks_checksum.txt)
          mkdir --parents "${RUNNER_TEMP}/gitleaks-bin"
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}/gitleaks-bin"
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" version
      - name: Run the local secret scan
        run: pnpm secret:scan

  docker:
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v4.2.2
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build -t ai-window-manager:ci .
      - name: Compose hardening and persistence smoke test
        run: |
          set -euo pipefail
          export COMPOSE_PROJECT_NAME=awm-ci
          export AWM_HOST_PORT=18787
          trap 'docker compose down --volumes || true' EXIT
          wait_for_health() {
            local attempts=30
            for i in $(seq 1 "$attempts"); do
              if curl --fail --silent "http://127.0.0.1:${AWM_HOST_PORT}/healthz" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            docker compose ps
            docker compose logs --no-color
            return 1
          }
          docker compose up -d --build
          wait_for_health
          docker compose ps
          curl --fail "http://127.0.0.1:${AWM_HOST_PORT}/healthz"
          curl --fail "http://127.0.0.1:${AWM_HOST_PORT}/metrics" >/dev/null
          curl --fail "http://127.0.0.1:${AWM_HOST_PORT}/" >/dev/null
          curl --fail "http://127.0.0.1:${AWM_HOST_PORT}/history" >/dev/null
          curl --fail "http://127.0.0.1:${AWM_HOST_PORT}/api/v1/providers" >/dev/null
          docker compose restart ai-window-manager
          wait_for_health
          curl --fail "http://127.0.0.1:${AWM_HOST_PORT}/healthz" >/dev/null
          docker compose stop ai-window-manager
          docker compose up -d
          wait_for_health
          curl --fail "http://127.0.0.1:${AWM_HOST_PORT}/healthz" >/dev/null
          logs="$(docker compose logs --no-color)"
          if printf '%s\n' "$logs" | grep -Eiq 'unhandled|sqlite_error|secret|token|authorization:'; then
            printf '%s\n' "$logs"
            exit 1
          fi
