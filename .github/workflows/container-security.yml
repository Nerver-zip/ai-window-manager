name: Container security scan

on:
  schedule:
    - cron: '0 12 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build image from current base images
        run: docker build --pull --tag ai-window-manager:security-scan .
      - name: Scan image for OS and library vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ai-window-manager:security-scan
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: HIGH,CRITICAL
