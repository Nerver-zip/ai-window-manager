name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # CodeQL is enabled for public repositories; private use requires a paid
    # GitHub Code Security plan and is intentionally skipped here.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.38.2
